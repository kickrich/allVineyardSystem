upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:80;
}

upstream vineyard_app_upstream {
    server vineyard-app:80;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 2g;
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;

    # React SPA — только frontend (статический nginx). Не backend: у Rails нет GET /.
    location = / {
        proxy_pass http://frontend_upstream/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /up {
        proxy_pass http://backend_upstream/up;
        proxy_set_header Host $host;
    }

    location = /vineyard {
        return 301 $scheme://$host/vineyard/;
    }

    location ~ ^/video/(\d+)(/.*)?$ {
        return 301 $scheme://$host/vineyard/video/$1$2;
    }

    location /vineyard/ {
        proxy_pass http://vineyard_app_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
