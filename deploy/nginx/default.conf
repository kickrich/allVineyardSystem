upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:80;
}

upstream vineyard_app_upstream {
    server vineyard-app:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2g;
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /up {
        proxy_pass http://backend_upstream/up;
        proxy_set_header Host $host;
    }

    location = /vineyard {
        return 301 $scheme://$host/vineyard/;
    }

    # Старые ссылки без префикса → vineyardApp.
    location ~ ^/video/(\d+)(/.*)?$ {
        return 301 $scheme://$host/vineyard/video/$1$2;
    }

    # Срезаем /vineyard/ — в контейнер уходит /, /video/1, /assets/...
    # Ссылки и ассеты: RAILS_RELATIVE_URL_ROOT=/vineyard в vineyard-app.
    location /vineyard/ {
        proxy_pass http://vineyard_app_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
