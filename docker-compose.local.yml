# Локальный запуск production-стека (Windows / Linux / macOS).
# Использование: см. LOCAL-DEV.md или ./local-dev.ps1

services:
  cv:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./cvService/models:/app/models
      - ./cvService/app:/app/app

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  nginx:
    ports:
      - "${HTTP_PORT:-8080}:80"
